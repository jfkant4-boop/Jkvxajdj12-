<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Sistema 🧑‍💻</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // ==========================================
        // CONFIGURAÇÃO DE VENCIMENTO EM TEMPO REAL
        // ==========================================
        // Mude para 2024 para BLOQUEAR agora ou 2027 para LIBERAR.
        const dataExpiracao = new Date(2025, 5, 29, 0, 0, 0); 

        function verificarBloqueio() {
            const dataHoje = new Date();

            if (dataHoje >= dataExpiracao) {
                // Bloqueia a tela imediatamente e remove todo o conteúdo
                document.body.innerHTML = `
                    <div style="background:#000; color:#fff; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-family:'Outfit', sans-serif; padding:20px; position:fixed; top:0; left:0; width:100%; z-index:9999999;">
                        <span style="font-size:5rem;">⚠️</span>
                        <h1 style="color:#D4AF37; margin-top:20px; font-weight:800;">SISTEMA BLOQUEADO</h1>
                        <p style="color:#8E8E93; max-width:300px; margin-top:10px; font-size:1.1rem;">O prazo de licenciamento expirou. Entre em contato com o suporte para renovar seu acesso.</p>
                        <a href="https://wa.me/5563999973657?text=Olá%20Jair,%20meu%20sistema%20expirou." 
                           style="margin-top:30px; background:#D4AF37; color:#000; padding:18px 35px; border-radius:12px; text-decoration:none; font-weight:bold; text-transform:uppercase; display:inline-block; box-shadow: 0 10px 20px rgba(212,175,55,0.3);">
                           Falar com Suporte
                        </a>
                    </div>`;
                return true;
            }
            return false;
        }

        // Verifica assim que a página começa a carregar
        verificarBloqueio();

        // VIGIA: Verifica a cada 1 segundo (1000ms) se o tempo acabou
        setInterval(verificarBloqueio, 1000);
    </script>

    <style>
        :root {
            --bg-app: #0A0A0B; --bg-surface: #141416; --bg-elevated: #1D1D20; --border: #2A2A2E;
            --text-title: #FFFFFF; --text-base: #D1D1D6; --text-muted: #8E8E93;
            --gold: #D4AF37; --gold-dark: #997A15; 
            --success: #30D158; --danger: #FF453A; --warning: #FF9F0A; --info: #0A84FF;
            --zap: #BF5AF2; --wa: #25D366;
            --radius-md: 12px; --radius-lg: 20px; --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: #000; display: flex; justify-content: center; height: 100vh; overflow: hidden; color: var(--text-base); }
        .font-top { font-family: 'Outfit', sans-serif; }

        #app { width: 100%; max-width: 430px; background-color: var(--bg-app); position: relative; display: flex; flex-direction: column; overflow: hidden; display: none; }

        /* --- LOGIN --- */
        #login-screen { width: 100%; max-width: 430px; background: var(--bg-app); height: 100%; position: absolute; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .login-logo { font-size: 4rem; margin-bottom: 10px; filter: drop-shadow(0 10px 20px rgba(212, 175, 55, 0.2)); }
        .password-dots { display: flex; gap: 15px; margin-bottom: 40px; }
        .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text-muted); transition: 0.3s; }
        .dot.filled { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 280px; }
        .numpad-btn { width: 75px; height: 75px; border-radius: 50%; background: var(--bg-surface); border: 1px solid var(--border); color: white; font-size: 1.8rem; font-family: 'Outfit', sans-serif; display: flex; align-items: center; justify-content: center; margin: 0 auto; cursor: pointer; transition: 0.1s; }
        .numpad-btn:active { background: var(--border); transform: scale(0.9); }

        /* --- TOASTS --- */
        #toast-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 10px; width: 90%; pointer-events: none; }
        .toast { background: var(--bg-elevated); border: 1px solid var(--border); border-left: 4px solid var(--gold); color: white; padding: 14px 20px; border-radius: 8px; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; font-weight: 500; animation: slideDown 0.4s forwards; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }

        .top-bar { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--bg-app); z-index: 10; }
        .actions-header { display: flex; gap: 15px; align-items: center; }
        .bell-btn { position: relative; font-size: 1.5rem; color: white; cursor: pointer; }
        .bell-badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.6rem; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .lock-btn { color: var(--danger); font-size: 1.5rem; cursor: pointer; }

        .content { flex: 1; overflow-y: auto; padding: 15px 20px 130px; display: flex; flex-direction: column; gap: 20px; }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: flex; flex-direction: column; gap: 15px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        .capital-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .capital-card { background: var(--bg-surface); border: 1px solid var(--border); padding: 15px; border-radius: var(--radius-md); position: relative; overflow: hidden; }
        .cap-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .cap-value { font-size: 1.35rem; color: white; }

        .bottom-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 95px; background: rgba(10,10,11,0.95); backdrop-filter: blur(15px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: 25px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-muted); font-size: 0.7rem; font-weight: 500; cursor: pointer; }
        .nav-item.active { color: var(--gold); }

        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: none; opacity: 0; transition: 0.3s; }
        .modal-overlay.active { display: block; opacity: 1; }
        .modal-sheet { position: absolute; bottom: -100%; left: 0; width: 100%; background: var(--bg-app); border-radius: 24px 24px 0 0; padding: 25px 20px; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); max-height: 90vh; overflow-y: auto; border-top: 1px solid var(--border);}
        .modal-overlay.active .modal-sheet { bottom: 0; }
        
        .custom-input { width: 100%; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-title); padding: 16px; border-radius: var(--radius-md); font-size: 0.95rem; outline: none; margin-bottom: 15px;}
        .btn-submit { width: 100%; padding: 18px; border-radius: var(--radius-md); background: var(--gold); color: #000; border: none; font-size: 1rem; font-family: 'Outfit', sans-serif; font-weight: 800; cursor: pointer; text-transform: uppercase;}
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="login-screen">
        <div class="login-logo">🧑‍💻</div>
        <h1 class="font-top" style="font-size: 1.5rem; color: white; margin-bottom: 30px;">Meu Sistema</h1>
        <div class="password-dots" id="dots-container"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="numpad">
            <button class="numpad-btn" onclick="typePass(1)">1</button><button class="numpad-btn" onclick="typePass(2)">2</button><button class="numpad-btn" onclick="typePass(3)">3</button>
            <button class="numpad-btn" onclick="typePass(4)">4</button><button class="numpad-btn" onclick="typePass(5)">5</button><button class="numpad-btn" onclick="typePass(6)">6</button>
            <button class="numpad-btn" onclick="typePass(7)">7</button><button class="numpad-btn" onclick="typePass(8)">8</button><button class="numpad-btn" onclick="typePass(9)">9</button>
            <div></div><button class="numpad-btn" onclick="typePass(0)">0</button><button class="numpad-btn" style="background:transparent; border:none; color:var(--danger);" onclick="clearPass()"><i class="ph-bold ph-backspace"></i></button>
        </div>
    </div>

    <div id="app">
        <header class="top-bar">
            <div>
                <h1 class="font-top" style="font-size: 1.2rem; color: var(--gold);">Meu Sistema 🧑‍💻</h1>
                <p style="font-size: 0.75rem; color: var(--text-muted);" id="current-date-header"></p>
            </div>
            <div class="actions-header">
                <div class="lock-btn" onclick="lockApp()"><i class="ph-bold ph-lock-key"></i></div>
            </div>
        </header>

        <main class="content">
            <div id="view-dashboard" class="view active">
                <h3 style="font-size: 1rem; color: white;">Monitor de Capital</h3>
                <div class="capital-grid">
                    <div class="capital-card"><p class="cap-title">Saldo Caixa</p><h2 class="font-top cap-value" id="ind-caixa">R$ 0,00</h2></div>
                    <div class="capital-card"><p class="cap-title">Na Rua</p><h2 class="font-top cap-value" id="ind-rua">R$ 0,00</h2></div>
                </div>
                <div style="background: var(--bg-surface); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-top: 10px; text-align: center;">
                    <p style="color: var(--text-muted);">Acesso Liberado até Junho/2027</p>
                </div>
            </div>
        </main>

        <nav class="bottom-bar">
            <div class="nav-item active"><i class="ph-fill ph-squares-four" style="font-size: 1.6rem;"></i> Início</div>
            <div class="nav-item"><i class="ph-fill ph-users" style="font-size: 1.6rem;"></i> Clientes</div>
            <div class="nav-item"><i class="ph-fill ph-hand-coins" style="font-size: 1.6rem;"></i> Emprestar</div>
            <div class="nav-item"><i class="ph-bold ph-list" style="font-size: 1.6rem;"></i> Menu</div>
        </nav>
    </div>

    <script>
        // BANCO DE DADOS LOCAL
        let db = JSON.parse(localStorage.getItem('sgc_v6')) || { password: '4455', saldoCaixa: 10000, clients: [], loans: [] };
        const saveDb = () => localStorage.setItem('sgc_v6', JSON.stringify(db));
        
        const fmtM = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

        // LOGIN
        let typed = '';
        function typePass(n) {
            if(typed.length < 4) { 
                typed += n; 
                document.querySelectorAll('.dot').forEach((d, i) => i < typed.length ? d.classList.add('filled') : d.classList.remove('filled')); 
            }
            if(typed.length === 4) {
                setTimeout(() => { 
                    if(typed === db.password) { 
                        document.getElementById('login-screen').style.display = 'none'; 
                        document.getElementById('app').style.display = 'flex'; 
                        initApp(); 
                    } else { 
                        typed=''; 
                        document.querySelectorAll('.dot').forEach(d=>d.classList.remove('filled'));
                    } 
                }, 200);
            }
        }

        function lockApp() { location.reload(); }

        function initApp() {
            document.getElementById('current-date-header').innerText = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('ind-caixa').innerText = fmtM(db.saldoCaixa);
        }
    </script>
</body>
</html>
